<!-- https://ram133.github.io/getpay/ -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TELEGRAM DIRECTORY</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #111315;
      color: #f2f4f7;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: 1px solid #343a40;
      background: #1b1f23;
      color: #f2f4f7;
      font-size: 15px;
      box-sizing: border-box;
    }
    .categories-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .category-chip {
      background: #1b1f23;
      border: 1px solid #343a40;
      color: #f2f4f7;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .category-chip:hover,
    .category-chip.active {
      border-color: #58a6ff;
      background: #222a35;
    }
    h2 {
      border-bottom: 1px solid #2b3036;
      padding-bottom: 6px;
      margin-top: 28px;
      font-size: 19px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 12px 0;
    }
    li {
      margin: 8px 0;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
      word-break: break-all;
    }
    a:hover {
      text-decoration: underline;
    }
    .status {
      color: #9aa4b2;
      font-size: 14px;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .error {
      color: #ff7b72;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TELEGRAM DIRECTORY</h1>
    <input id="search" type="search" placeholder="Filter by bot name or category..." />
    <div id="categories" class="categories-bar" aria-label="Categories"></div>
    <div id="status" class="status">Loading links...</div>
    <div id="directory"></div>
  </div>

  <script>
    const SHEET_ID = "1yJBr9fHUoAB8HAxrRzniYLL2_A4dCOXvJQbc8YBdfuA";
    const GID = "1767456501";
    const SHEET_VIEW_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${GID}`;

    let allRows = [];
    let selectedCategory = "";

    function loadViaJsonp() {
      return new Promise((resolve, reject) => {
        const cbName = "gvizCb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out"));
        }, 12000);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          script.remove();
        }

        window[cbName] = (data) => {
          cleanup();
          if (!data || !data.table || !Array.isArray(data.table.rows)) {
            reject(new Error("Sheet returned no table data"));
            return;
          }
          const rows = data.table.rows.map((r) =>
            (r.c || []).map((cell) => {
              if (!cell || cell.v == null) return "";
              return String(cell.f != null ? cell.f : cell.v).trim();
            })
          );
          resolve(rows);
        };

        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=responseHandler:${cbName}&_=${Date.now()}`;
        script.onerror = () => {
          cleanup();
          reject(new Error("Access denied or network error"));
        };
        document.body.appendChild(script);
      });
    }

    function renderCategories() {
      const bar = document.getElementById("categories");
      bar.innerHTML = "";

      const counts = new Map();
      for (const item of allRows) {
        const cat = item.category || "Uncategorized";
        counts.set(cat, (counts.get(cat) || 0) + 1);
      }

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "category-chip" + (selectedCategory === "" ? " active" : "");
      allBtn.textContent = `All (${allRows.length})`;
      allBtn.onclick = () => {
        selectedCategory = "";
        render(document.getElementById("search").value);
      };
      bar.appendChild(allBtn);

      for (const [cat, count] of counts.entries()) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-chip" + (selectedCategory === cat ? " active" : "");
        btn.textContent = `${cat} (${count})`;
        btn.onclick = () => {
          selectedCategory = selectedCategory === cat ? "" : cat;
          render(document.getElementById("search").value);
        };
        bar.appendChild(btn);
      }
    }

    function render(filterText = "") {
      renderCategories();
      const q = filterText.trim().toLowerCase();
      const grouped = new Map();

      for (const item of allRows) {
        const cat = item.category || "Uncategorized";
        if (selectedCategory && cat !== selectedCategory) continue;

        const match =
          !q ||
          cat.toLowerCase().includes(q) ||
          item.bot_name.toLowerCase().includes(q) ||
          item.url.toLowerCase().includes(q);
        if (!match) continue;

        if (!grouped.has(cat)) grouped.set(cat, []);
        grouped.get(cat).push(item);
      }

      const container = document.getElementById("directory");
      container.innerHTML = "";

      if (grouped.size === 0) {
        container.innerHTML = "<p>No matching Telegram entries found.</p>";
        return;
      }

      for (const [cat, items] of grouped.entries()) {
        const h2 = document.createElement("h2");
        h2.textContent = `${cat} (${items.length})`;
        container.appendChild(h2);

        const ul = document.createElement("ul");
        for (const item of items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = item.bot_name || item.url;
          li.appendChild(a);
          ul.appendChild(li);
        }
        container.appendChild(ul);
      }
    }

    async function init() {
      const statusEl = document.getElementById("status");
      try {
        const rows = await loadViaJsonp();
        const firstRow = rows[0] || [];
        const looksLikeHeader =
          /category/i.test(firstRow[0] || "") &&
          (/bot/i.test(firstRow[1] || "") || /name/i.test(firstRow[1] || "") || /url/i.test(firstRow[2] || ""));
        const dataRows = looksLikeHeader ? rows.slice(1) : rows;

        allRows = dataRows
          .map((cols) => ({
            category: cols[0] || "Uncategorized",
            bot_name: cols[1] || "",
            url: cols[2] || ""
          }))
          .filter((item) => /^https?:\/\//i.test(item.url));

        statusEl.className = "status";
        statusEl.textContent = `Loaded ${allRows.length} entries.`;
        render();
      } catch (err) {
        statusEl.className = "status error";
        statusEl.innerHTML =
          `Failed to load sheet: ${err.message}. ` +
          `Set Google Sheet <strong>Share -> General access -> Anyone with the link -> Viewer</strong>, or ` +
          `<a href="${SHEET_VIEW_URL}" target="_blank" rel="noopener noreferrer">open the sheet</a>.`;
      }
    }

    document.getElementById("search").addEventListener("input", (e) => {
      render(e.target.value);
    });

    init();
  </script>
</body>
</html>
