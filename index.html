<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Bots Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #111315;
      color: #f2f4f7;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 24px;
      border-radius: 6px;
      border: 1px solid #343a40;
      background: #1b1f23;
      color: #f2f4f7;
      font-size: 15px;
      box-sizing: border-box;
    }
    h2 {
      border-bottom: 1px solid #2b3036;
      padding-bottom: 6px;
      margin-top: 28px;
      font-size: 19px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 12px 0;
    }
    li {
      margin: 8px 0;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
      word-break: break-all;
    }
    a:hover {
      text-decoration: underline;
    }
    .status {
      color: #9aa4b2;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Telegram Bots Directory</h1>
    <input id="search" type="search" placeholder="Filter by bot name or category..." />
    <div id="status" class="status">Loading links...</div>
    <div id="directory"></div>
  </div>

  <script>
    const CSV_URL = "PASTE_YOUR_PUBLISHED_CSV_URL_HERE";
    let allRows = [];

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(field.trim());
          field = "";
        } else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && next === "\n") i++;
          row.push(field.trim());
          if (row.some((cell) => cell.length > 0)) rows.push(row);
          row = [];
          field = "";
        } else {
          field += ch;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        if (row.some((cell) => cell.length > 0)) rows.push(row);
      }
      return rows;
    }

    function render(filterText = "") {
      const q = filterText.trim().toLowerCase();
      const grouped = new Map();

      for (const item of allRows) {
        const match =
          !q ||
          item.category.toLowerCase().includes(q) ||
          item.bot_name.toLowerCase().includes(q) ||
          item.url.toLowerCase().includes(q);
        if (!match) continue;

        if (!grouped.has(item.category)) grouped.set(item.category, []);
        grouped.get(item.category).push(item);
      }

      const container = document.getElementById("directory");
      container.innerHTML = "";

      if (grouped.size === 0) {
        container.innerHTML = '<p class="status">No matching Telegram links found.</p>';
        return;
      }

      for (const [category, items] of grouped.entries()) {
        const heading = document.createElement("h2");
        heading.textContent = category;
        container.appendChild(heading);

        const list = document.createElement("ul");
        for (const item of items) {
          const li = document.createElement("li");
          const label = document.createElement("strong");
          label.textContent = item.bot_name + ": ";

          const link = document.createElement("a");
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = item.url;

          li.appendChild(label);
          li.appendChild(link);
          list.appendChild(li);
        }
        container.appendChild(list);
      }
    }

    async function loadDirectory() {
      const status = document.getElementById("status");
      try {
        const cacheBustUrl = `${CSV_URL}${CSV_URL.includes("?") ? "&" : "?"}t=${Date.now()}`;
        const res = await fetch(cacheBustUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csvText = await res.text();
        const parsed = parseCSV(csvText);

        const headers = (parsed[0] || []).map((h) => h.toLowerCase());
        const catIdx = headers.indexOf("category");
        const nameIdx = headers.indexOf("bot_name");
        const urlIdx = headers.indexOf("url");

        allRows = parsed
          .slice(1)
          .map((cols) => ({
            category: cols[catIdx >= 0 ? catIdx : 0] || "Uncategorized",
            bot_name: cols[nameIdx >= 0 ? nameIdx : 1] || "Bot",
            url: cols[urlIdx >= 0 ? urlIdx : 2] || ""
          }))
          .filter((item) => item.url.startsWith("http"));

        status.textContent = `Showing ${allRows.length} Telegram links (auto-synced from Google Sheets).`;
        render();
      } catch (err) {
        status.textContent = `Could not load sheet CSV (${err.message}). Make sure the sheet is published to web as CSV.`;
      }
    }

    document.getElementById("search").addEventListener("input", (e) => {
      render(e.target.value);
    });

    loadDirectory();
  </script>
</body>
</html>
