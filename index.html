    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(field.trim());
          field = "";
        } else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && next === "\n") i++;
          row.push(field.trim());
          if (row.some((cell) => cell.length > 0)) rows.push(row);
          row = [];
          field = "";
        } else {
          field += ch;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        if (row.some((cell) => cell.length > 0)) rows.push(row);
      }
      return rows;
    }

    function renderLinks(urls) {
      const list = document.getElementById("links");
      list.innerHTML = "";
      for (const cell of urls) {
        if (/^https?:\/\//i.test(cell)) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = cell;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = cell;
          li.appendChild(a);
          list.appendChild(li);
        }
      }
    }

    async function loadLinks() {
      try {
        const url = `${CSV_URL}&t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const csvText = await res.text();
        const parsed = parseCSV(csvText);
        const urls = [];

        for (const row of parsed) {
          for (const cell of row) {
            if (/^https?:\/\//i.test(cell)) {
              urls.push(cell);
            }
          }
        }

        renderLinks(urls.length > 0 ? urls : FALLBACK_LINKS);
      } catch (err) {
        renderLinks(FALLBACK_LINKS);
      }
    }

    loadLinks();
