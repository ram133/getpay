<!-- https://ram133.github.io/getpay/ -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TELEGRAM DIRECTORY</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #111315;
      color: #f2f4f7;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: 1px solid #343a40;
      background: #1b1f23;
      color: #f2f4f7;
      font-size: 15px;
      box-sizing: border-box;
    }
    .categories-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .category-chip {
      background: #1b1f23;
      border: 1px solid #343a40;
      color: #f2f4f7;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .category-chip:hover,
    .category-chip.active {
      border-color: #58a6ff;
      background: #222a35;
    }
    h2 {
      border-bottom: 1px solid #2b3036;
      padding-bottom: 6px;
      margin-top: 28px;
      font-size: 19px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 12px 0;
    }
    li {
      margin: 8px 0;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
      word-break: break-all;
    }
    a:hover {
      text-decoration: underline;
    }
    .status {
      color: #9aa4b2;
      font-size: 14px;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .error {
      color: #ff7b72;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TELEGRAM DIRECTORY</h1>
    <input id="search" type="search" placeholder="Filter by bot name or category..." />
    <div id="categories" class="categories-bar" aria-label="Categories"></div>
    <div id="status" class="status">Loading links...</div>
    <div id="directory"></div>
  </div>

  <script>
    const SHEET_ID = "1yJBr9fHUoAB8HAxrRzniYLL2_A4dCOXvJQbc8YBdfuA";
    const GID = "1767456501";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
    const SHEET_VIEW_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${GID}`;

    let allRows = [];
    let selectedCategory = "";

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(field.trim());
          field = "";
        } else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && next === "\n") i++;
          row.push(field.trim());
          if (row.some((cell) => cell.length > 0)) rows.push(row);
          row = [];
          field = "";
        } else {
          field += ch;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        if (row.some((cell) => cell.length > 0)) rows.push(row);
      }
      return rows;
    }

    function loadViaJsonp() {
      return new Promise((resolve, reject) => {
        const cbName = "gvizCb_" + Date.now();
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Sheet timed out (check Share: Anyone with the link can view)"));
        }, 10000);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          script.remove();
        }

        window[cbName] = (data) => {
          cleanup();
          if (!data || !data.table || !Array.isArray(data.table.rows)) {
            reject(new Error("Invalid sheet response"));
            return;
          }
          const rows = data.table.rows.map((r) =>
            (r.c || []).map((cell) => (cell && cell.v != null ? String(cell.v).trim() : ""))
          );
          resolve(rows);
        };

        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=responseHandler:${cbName}`;
        script.onerror = () => {
          cleanup();
          reject(new Error("Failed to load sheet script (sheet may be private)"));
        };
        document.body.appendChild(script);
      });
    }

    function renderCategories() {
      const bar = document.getElementById("categories");
      bar.innerHTML = "";

      const counts = new Map();
      for (const item of allRows) {
        const cat = item.category || "Uncategorized";
        counts.set(cat, (counts.get(cat) || 0) + 1);
      }

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "category-chip" + (selectedCategory === "" ? " active" : "");
      allBtn.textContent = `All (${allRows.length})`;
      allBtn.onclick = () => {
        selectedCategory = "";
        render(document.getElementById("search").value);
      };
      bar.appendChild(allBtn);

      for (const [cat, count] of counts.entries()) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-chip" + (selectedCategory === cat ? " active" : "");
        btn.textContent = `${cat} (${count})`;
        btn.onclick = () => {
          selectedCategory = selectedCategory === cat ? "" : cat;
          render(document.getElementById("search").value);
        };
        bar.appendChild(btn);
      }
    }

    function render(filterText = "") {
      renderCategories();
      const q = filterText.trim().toLowerCase();
      const grouped = new Map();

      for (const item of allRows) {
        const cat = item.category || "Uncategorized";
        if (selectedCategory && cat !== selectedCategory) continue;

        const match =
          !q ||
          cat.toLowerCase().includes(q) ||
          item.bot_name.toLowerCase().includes(q) ||
          item.url.toLowerCase().includes(q);
        if (!match) continue;

        if (!grouped.has(cat)) grouped.set(cat, []);
        grouped.get(cat).push(item);
      }

      const container = document.getElementById("directory");
      container.innerHTML = "";

      if (grouped.size === 0) {
        container.innerHTML = "<p>No matching Telegram entries found.</p>";
        return;
      }

      for (const [cat, items] of grouped.entries()) {
        const h2 = document.createElement("h2");
        h2.textContent = `${cat} (${items.length})`;
        container.appendChild(h2);

        const ul = document.createElement("ul");
        for (const item of items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = item.bot_name || item.url;
          li.appendChild(a);
          ul.appendChild(li);
        }
        container.appendChild(ul);
      }
    }

    function setEntriesFromRows(rows, hasHeader = true) {
      const dataRows = hasHeader ? rows.slice(1) : rows;
      allRows = dataRows
        .map((cols) => ({
          category: cols[0] || "Uncategorized",
          bot_name: cols[1] || "",
          url: cols[2] || ""
        }))
        .filter((item) => /^https?:\/\//i.test(item.url));

      const statusEl = document.getElementById("status");
      statusEl.className = "status";
      statusEl.textContent = `Loaded ${allRows.length} entries.`;
      render();
    }

    async function init() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch(CSV_URL, { cache: "no-store" });
        const text = await res.text();
        if (!res.ok || /^\s*<!DOCTYPE html/i.test(text) || /^\s*<html/i.test(text)) {
          throw new Error(`CSV fetch returned HTML or HTTP ${res.status}`);
        }
        setEntriesFromRows(parseCSV(text), true);
      } catch (csvErr) {
        try {
          const jsonpRows = await loadViaJsonp();
          setEntriesFromRows(jsonpRows, false);
        } catch (jsonpErr) {
          statusEl.className = "status error";
          statusEl.innerHTML =
            `Could not load sheet: ${jsonpErr.message}. ` +
            `Make sure the Google Sheet is shared as <strong>Anyone with the link (Viewer)</strong>, or ` +
            `<a href="${SHEET_VIEW_URL}" target="_blank" rel="noopener noreferrer">open the sheet</a> to verify access.`;
        }
      }
    }

    document.getElementById("search").addEventListener("input", (e) => {
      render(e.target.value);
    });

    init();
  </script>
</body>
</html>
